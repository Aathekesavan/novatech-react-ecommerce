<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="laptop-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="lap-shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="300" height="300" rx="20" fill="#f1f5f9"/>
  <g filter="url(#lap-shadow)">
    <!-- Display Screen -->
    <rect x="50" y="65" width="200" height="130" rx="10" fill="#1e293b"/>
    <rect x="58" y="73" width="184" height="114" rx="6" fill="url(#laptop-screen)"/>
    <!-- Screen graphic lines -->
    <circle cx="150" cy="120" r="22" fill="rgba(255,255,255,0.2)"/>
    <path d="M 80 150 Q 120 120, 150 140 T 220 130" fill="none" stroke="#60a5fa" stroke-width="4"/>
    <!-- Webcam -->
    <circle cx="150" cy="69" r="2" fill="#64748b"/>
    <!-- Laptop Base -->
    <path d="M 30 195 L 270 195 L 255 210 L 45 210 Z" fill="#94a3b8"/>
    <path d="M 130 195 L 170 195 L 168 199 L 132 199 Z" fill="#64748b"/>
    <rect x="40" y="210" width="220" height="6" rx="3" fill="#64748b"/>
  </g>
</svg>
