<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="hp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="300" height="300" rx="20" fill="#f1f5f9"/>
  <g filter="url(#shadow)">
    <!-- Headband Arch -->
    <path d="M 65 155 C 65 65, 235 65, 235 155" fill="none" stroke="url(#hp-grad)" stroke-width="22" stroke-linecap="round"/>
    <path d="M 90 120 C 110 90, 190 90, 210 120" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <!-- Left Ear Cup -->
    <rect x="50" y="140" width="34" height="64" rx="17" fill="url(#hp-grad)"/>
    <rect x="74" y="145" width="14" height="54" rx="7" fill="url(#cushion)"/>
    <!-- Right Ear Cup -->
    <rect x="216" y="140" width="34" height="64" rx="17" fill="url(#hp-grad)"/>
    <rect x="212" y="145" width="14" height="54" rx="7" fill="url(#cushion)"/>
    <!-- Accent indicator light -->
    <circle cx="67" cy="188" r="3.5" fill="#10b981"/>
    <circle cx="233" cy="188" r="3.5" fill="#10b981"/>
  </g>
</svg>
