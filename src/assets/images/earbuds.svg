<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <filter id="eb-shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="300" height="300" rx="20" fill="#f1f5f9"/>
  <g filter="url(#eb-shadow)">
    <!-- Charging Case -->
    <rect x="80" y="110" width="140" height="100" rx="40" fill="#0f172a"/>
    <path d="M 80 145 L 220 145" stroke="#334155" stroke-width="2"/>
    <circle cx="150" cy="165" r="4" fill="#3b82f6"/>
    <!-- Left Earbud -->
    <g transform="translate(100, 60)">
      <circle cx="15" cy="15" r="14" fill="#1e293b"/>
      <rect x="10" y="22" width="10" height="32" rx="5" fill="#334155"/>
      <circle cx="15" cy="15" r="6" fill="#3b82f6"/>
    </g>
    <!-- Right Earbud -->
    <g transform="translate(170, 60)">
      <circle cx="15" cy="15" r="14" fill="#1e293b"/>
      <rect x="10" y="22" width="10" height="32" rx="5" fill="#334155"/>
      <circle cx="15" cy="15" r="6" fill="#3b82f6"/>
    </g>
  </g>
</svg>
