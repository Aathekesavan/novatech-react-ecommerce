<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <filter id="dr-shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="300" height="300" rx="20" fill="#f1f5f9"/>
  <g filter="url(#dr-shadow)">
    <!-- Diagonal Arms -->
    <line x1="80" y1="80" x2="220" y2="220" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
    <line x1="220" y1="80" x2="80" y2="220" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
    <!-- Propellers (Rotors) -->
    <ellipse cx="80" cy="80" rx="36" ry="10" fill="rgba(37, 99, 235, 0.4)"/>
    <circle cx="80" cy="80" r="8" fill="#0f172a"/>
    <ellipse cx="220" cy="80" rx="36" ry="10" fill="rgba(37, 99, 235, 0.4)"/>
    <circle cx="220" cy="80" r="8" fill="#0f172a"/>
    <ellipse cx="80" cy="220" rx="36" ry="10" fill="rgba(37, 99, 235, 0.4)"/>
    <circle cx="80" cy="220" r="8" fill="#0f172a"/>
    <ellipse cx="220" cy="220" rx="36" ry="10" fill="rgba(37, 99, 235, 0.4)"/>
    <circle cx="220" cy="220" r="8" fill="#0f172a"/>
    <!-- Central Fuselage -->
    <ellipse cx="150" cy="150" rx="42" ry="54" fill="#0f172a"/>
    <circle cx="150" cy="120" r="12" fill="#2563eb"/>
    <circle cx="150" cy="120" r="6" fill="#60a5fa"/>
    <rect x="142" y="160" width="16" height="24" rx="4" fill="#334155"/>
    <circle cx="150" cy="195" r="4" fill="#10b981"/>
  </g>
</svg>
