<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="watch-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="watch-shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="300" height="300" rx="20" fill="#f1f5f9"/>
  <g filter="url(#watch-shadow)">
    <!-- Straps -->
    <path d="M 115 25 L 185 25 L 180 90 L 120 90 Z" fill="#475569"/>
    <path d="M 120 210 L 180 210 L 185 275 L 115 275 Z" fill="#475569"/>
    <!-- Watch Case -->
    <rect x="95" y="80" width="110" height="140" rx="28" fill="url(#watch-body)"/>
    <!-- Crown Button -->
    <rect x="205" y="115" width="8" height="24" rx="4" fill="#94a3b8"/>
    <!-- Screen -->
    <rect x="105" y="90" width="90" height="120" rx="20" fill="url(#screen-grad)"/>
    <!-- Screen UI Elements -->
    <circle cx="150" cy="135" r="28" fill="none" stroke="#2563eb" stroke-width="5" stroke-dasharray="120 40"/>
    <circle cx="150" cy="135" r="20" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="80 30"/>
    <text x="150" y="141" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui">10:42</text>
    <text x="150" y="185" fill="#f59e0b" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui">♥ 74 BPM</text>
  </g>
</svg>
