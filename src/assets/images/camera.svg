<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <filter id="cam-shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="300" height="300" rx="20" fill="#f1f5f9"/>
  <g filter="url(#cam-shadow)">
    <!-- Camera Body -->
    <rect x="60" y="90" width="180" height="125" rx="16" fill="#1e293b"/>
    <!-- Viewfinder bump -->
    <rect x="120" y="72" width="60" height="24" rx="4" fill="#0f172a"/>
    <!-- Shutter button & dials -->
    <rect x="75" y="80" width="16" height="10" rx="2" fill="#ef4444"/>
    <rect x="205" y="82" width="22" height="8" rx="2" fill="#64748b"/>
    <!-- Big Lens -->
    <circle cx="150" cy="152" r="48" fill="#0f172a"/>
    <circle cx="150" cy="152" r="38" fill="#334155"/>
    <circle cx="150" cy="152" r="26" fill="#2563eb"/>
    <circle cx="140" cy="142" r="8" fill="rgba(255,255,255,0.4)"/>
    <!-- Grip texture -->
    <rect x="60" y="110" width="30" height="85" rx="4" fill="#0f172a"/>
  </g>
</svg>
